# Builds OutlookArchiver.exe on a Windows machine and attaches it to the run,
# so it can be downloaded from the Actions page.
name: Build Outlook Archiver (Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        run: python -m pip install pywin32==308 pyinstaller==6.11.1 pytest==8.3.3 msal==1.31.0 msal-extensions==1.2.0

      - name: Run tests
        run: python -m pytest -q tests

      - name: Check the Windows-only parts load
        run: python -c "import archiver.outlook_backend, archiver.graph_backend, archiver.server, msal, msal_extensions; print('imports ok')"

      - name: Build the .exe
        run: python -m PyInstaller --noconfirm --onefile --windowed --name OutlookArchiver --icon archiver/web/app.ico --hidden-import win32timezone --add-data "archiver/web;archiver/web" OutlookArchiver.py

      - name: Check the .exe starts and serves its screen
        shell: pwsh
        run: |
          $p = Start-Process dist\OutlookArchiver.exe -ArgumentList '--demo','--no-window','--port','8799' -PassThru
          Start-Sleep -Seconds 15
          $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8799/app.js
          Stop-Process -Id $p.Id -Force
          if ($r.StatusCode -ne 200 -or $r.Content -notmatch 'Outlook Archiver') { throw "the .exe did not serve its screen" }
          Write-Output "exe ok"

      - name: Check the window shows the sharp icon
        continue-on-error: true
        shell: pwsh
        run: |
          python -m pip install pillow==11.0.0
          $p = Start-Process dist\OutlookArchiver.exe -ArgumentList '--demo' -PassThru
          python tools/check_window_icon.py
          $code = $LASTEXITCODE
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-Process msedge -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          exit $code

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: window-check
          path: outlook-archiver-window-check.png
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: OutlookArchiver-windows
          path: |
            dist/OutlookArchiver.exe
            README.md
          retention-days: 90
