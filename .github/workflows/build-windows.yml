# Builds OutlookArchiver.exe on a Windows machine and attaches it to the run,
# so it can be downloaded from the Actions page.
name: Build Outlook Archiver (Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        run: python -m pip install pywin32==308 pyinstaller==6.11.1 pytest==8.3.3

      - name: Run tests
        run: python -m pytest -q tests

      - name: Check the Windows-only parts load
        run: python -c "import archiver.outlook_backend, archiver.gui; print('imports ok')"

      - name: Build the .exe
        run: python -m PyInstaller --noconfirm --onefile --windowed --name OutlookArchiver --hidden-import win32timezone OutlookArchiver.py

      - uses: actions/upload-artifact@v4
        with:
          name: OutlookArchiver-windows
          path: |
            dist/OutlookArchiver.exe
            README.md
          retention-days: 90
